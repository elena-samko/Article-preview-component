<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Article preview component</title>
  </head>
  <body>
    <main class="page">
      <div class="article__card">
        <img
          class="article-card__img"
          alt="Green chest of drawers with a vase"
          src="./images/drawers.jpg"
        />
        <div class="article-card__content">
          <h1 class="article-card__title">
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </h1>
          <p class="article-card__info">
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I’ve got some simple tips to help
            you make any room feel complete.
          </p>
          <div class="article-card__customer">
            <img
              class="article-card__autor"
              alt="Photo of Michelle Appleton"
              src="./images/avatar-michelle.jpg"
              width="40px"
              height="40px"
            />
            <p class="article-card__autor-info">
              Michelle Appleton <br />28 Jun 2020
            </p>
            <button class="article-card__share">
              <spane class="visually-hidden">SHARE</spane>
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
